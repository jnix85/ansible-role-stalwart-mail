---
# Replace the example hosts with your own. The playbooks target the
# `mailservers` parent group; the child groups carry per-role settings
# in inventory/group_vars/<group>/vars.yml.
all:
  children:
    mailservers:
      children:
        mx_edges:
          # Inbound-only MX relays: accept on port 25, forward to the
          # mailbox server. Publish these as your MX records.
          hosts:
            mx01.clawduinomicrosystems.com:
              ansible_ssh_private_key_file: ~/.ssh/stalwart_mail.pem
              ansible_user: osadmin
            mx02.clawduinomicrosystems.com:
              ansible_ssh_private_key_file: ~/.ssh/stalwart_mail.pem
              ansible_user: osadmin
        mailbox_servers:
          # The full mail server users connect to (IMAP/JMAP/submission).
          hosts:
            mail.clawduinomicrosystems.com:
              ansible_ssh_private_key_file: ~/.ssh/stalwart_mail.pem
              ansible_user: osadmin